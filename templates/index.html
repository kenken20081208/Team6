<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ふとっちょかマッチョかマインダー</title>

  <link
    rel="stylesheet"
    href="/static/css/common.css"
  >

  <link
    rel="stylesheet"
    href="/static/css/index.css"
  >
</head>

<body class="index-page">
  <main class="index-stage">
    <img
      class="character character--futoccho index-character index-character--futoccho"
      src="/static/images/futoccho-character.png"
      alt=""
      aria-hidden="true"
    >

    <img
      class="character character--macho index-character index-character--macho"
      src="/static/images/macho-character.png"
      alt=""
      aria-hidden="true"
    >

    <section class="screen index-screen" aria-labelledby="app-title">
      <div class="index-content">
        <h1 id="app-title" class="index-title" aria-label="ふとっちょかマッチョ">
          <span class="index-title__first" aria-hidden="true">
            <span class="font-futoccho index-title__futoccho">ふとっちょ</span>
            <span class="index-title__connector">か</span>
          </span>

          <span class="font-macho index-title__macho" aria-hidden="true">
            <span>マ</span><span>ッ</span><span>チ</span><span>ョ</span>
          </span>
        </h1>

        <p class="index-subtitle">マインダー</p>

        <p class="index-description">
          あなたのマインドは<br>
          ふとっちょかマッチョかー。
        </p>

        <a class="button index-start-button" href="/start">
          開始
        </a>
      </div>
    </section>
  </main>
</body>
</html>
