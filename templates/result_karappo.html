<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結果画面</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/result.css">
</head>

<body class="result-page result-page--karappo">
  <main class="screen result-screen">
    <p class="label result-label">RESULT</p>

    <p class="result-lead">あなたのマインドは――。</p>

    <div class="result-details">
      <h1 class="result-title result-title--karappo">
        空っぽマインド
      </h1>

      <p class="orange-panel result-description">
        何もかもを見抜く力を持っていない、空っぽのマインド。
        少しくらい、物事を見抜いてみましょう。
      </p>

      <p class="speech-bubble result-score">
        ふとっちょ正解数：{{ futoccho_point }}問<br>
        マッチョ正解数：{{ macho_point }}問<br>
        合計正解数：{{ total_correct }} / {{ total_questions }}問
      </p>

      <a class="button result-restart" href="/">
        もう一度遊ぶ？
      </a>
    </div>
  </main>
</body>
</html>
