<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>結果画面</title>

  <link
    rel="stylesheet"
    href="/static/css/common.css"
  >

  <link
    rel="stylesheet"
    href="/static/css/result.css"
  >
</head>

<body>
  <main class="screen">
    <p class="label">
      結果画面
    </p>

    <h1>
      空っぽマインド
    </h1>

    <p>
    雑念ゼロ！透き通るほどピュアなマインドです。<br>
    偏見や先入観に邪魔されず、ありのままを受け止めるニュートラルな状態。次は自分の直感やこだわりを少しプラスして遊んでみよう！
    </p>
    <p>
      ふとっちょ正解数：{{ futoccho_point }}問<br>
      マッチョ正解数：{{ macho_point }}問<br>
      合計正解数：{{ total_correct }} / {{ total_questions }}問
    </p>
    <a class="button" href="/">
      もう一度遊ぶ？
    </a>
  </main>
</body>
</html>
