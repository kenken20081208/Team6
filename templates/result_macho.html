<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結果画面</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/result.css">
</head>

<body class="result-page result-page--macho">
  <img
    class="character result-character result-character--macho"
    src="/static/images/macho-character.png"
    alt="マッチョの人物"
  >

  <main class="screen result-screen">
    <p class="label result-label">RESULT</p>

    <p class="result-lead">あなたのマインドは――。</p>

    <div class="result-details">
      <h1 class="result-name result-name--macho" aria-label="マッチョ">
        <span class="result-name__char result-name__char--1" aria-hidden="true">マ</span>
        <span class="result-name__char result-name__char--2" aria-hidden="true">ッ</span>
        <span class="result-name__char result-name__char--3" aria-hidden="true">チ</span>
        <span class="result-name__char result-name__char--4" aria-hidden="true">ョ</span>
      </h1>

      <p class="orange-panel result-description">
        大量の食事も体重増加も、
        すべて筋肉への投資だと考えるタイプ。

        その信頼はあまりにも強く、
        ただの運動不足まで才能の塊に見えることがあります。
      </p>

      <p class="speech-bubble result-score">
        ふとっちょ正解数：{{ futoccho_point }}問<br>
        マッチョ正解数：{{ macho_point }}問<br>
        合計正解数：{{ total_correct }} / {{ total_questions }}問
      </p>

      <a class="button result-restart" href="/">
        もう一度遊ぶ？
      </a>
    </div>
  </main>
</body>
</html>
