<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>クイズ画面</title>

  <link
    rel="stylesheet"
    href="/static/css/common.css"
  >

  <link
    rel="stylesheet"
    href="/static/css/quiz.css"
  >
</head>

<body>
  <main class="screen">
    <p class="label">
      QUESTION {{ "%02d"|format(question_number) }} / {{ "%02d"|format(total_questions) }}
    </p>

    <h1>
      クイズ画面
    </h1>

    <p class="question">{{question.question}}</p>

    <form action="/answer" method="POST">
      <input
          type="hidden"
          name="question_number"
          value="{{ question_number }}">

      <button
          type="submit"
          name="answer"
          value="ふとっちょ">
          ふとっちょ
      </button>

      <button
          type="submit"
          name="answer"
          value="マッチョ">
          マッチョ
      </button>

    </form>
  </main>
</body>
</html>
