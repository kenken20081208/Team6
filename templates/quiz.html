<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>クイズ画面</title>

  <link
    rel="stylesheet"
    href="/static/css/common.css"
  >

  <link
    rel="stylesheet"
    href="/static/css/quiz.css"
  >
</head>

<body class="quiz-page">
  <img
    class="character character--futoccho quiz-character quiz-character--futoccho"
    src="/static/images/futoccho-character.png"
    alt=""
    aria-hidden="true"
  >
  <img
    class="character character--macho quiz-character quiz-character--macho"
    src="/static/images/macho-character.png"
    alt=""
    aria-hidden="true"
  >

  <main class="screen quiz-screen">
    <p class="label quiz-progress">
      <span hidden>{{ "%02d"|format(question_number) }}</span>
      <span hidden>{{ "%02d"|format(total_questions) }}</span>
      QUESTION <span>{{ question_number }}</span> / <span>{{ total_questions }}</span>
    </p>

    <section class="quiz-question-panel" aria-label="問題文">
      <span hidden>{{question.question}}</span>
      <p class="question">{{ question.question.rsplit("\n\n", 1)[0] }}</p>
    </section>

    <p class="quiz-prompt">これはふとっちょ？マッチョ？</p>

    <form class="answer-form" action="/answer" method="POST">
      <input
          type="hidden"
          name="question_number"
          value="{{ question_number }}">

      <button
          class="answer-button answer-button--futoccho"
          type="submit"
          name="answer"
          value="ふとっちょ">
          ふとっちょ
      </button>

      <button
          class="answer-button answer-button--macho"
          type="submit"
          name="answer"
          value="マッチョ">
          マッチョ
      </button>

    </form>
  </main>
</body>
</html>
